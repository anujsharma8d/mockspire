<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('mockspire-theme'); } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="google-site-verification" content="0SGUSnHQFe1J7Cp5aXPuwih_4nrzVl5WlRrvRv7sGyw" />

    <title>Mockspire - AI Mock Interview Simulator & Interview Practice</title>

    <meta
      name="description"
      content="Practice technical, behavioral, HR, and system design interviews with Mockspire. Get AI-powered feedback, evaluate your answers, and improve your interview skills."
    />
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
